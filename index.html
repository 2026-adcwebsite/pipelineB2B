const cnt=(a,f)=>a.reduce((o,x)=>{const k=f(x)||'–';o[k]=(o[k]||0)+1;return o},{});
function bars(o,keys,colors){const mx=Math.max(1,...keys.map(k=>o[k]||0));return keys.map((k,i)=>`<div class="row"><span>${esc(k)}</span><div class="bar"><div style="width:${(o[k]||0)/mx*100}%;background:${colors?colors[k]||PC[i%7]:PC[i%7]}"></div></div><b>${o[k]||0}</b></div>`).join('')}
function donut(o){const ks=Object.keys(o),t=ks.reduce((s,k)=>s+o[k],0)||1;let p=0;const g=ks.map((k,i)=>{const s=p;p+=o[k]/t*100;return`${PC[i%7]} ${s}% ${p}%`}).join(',');return`<div class="don"><div class="ring" style="background:conic-gradient(${g||'var(--bd) 0 100%'})"></div><div class="lg">${ks.map((k,i)=>`<div><i style="background:${PC[i%7]}"></i>${esc(k)} <b>${o[k]}</b> <span class="mu">${Math.round(o[k]/t*100)}%</span></div>`).join('')}</div></div>`}
function dash(){
  const d=filt(),n=d.length,won=d.filter(m=>m.status==='Won').length,hot=d.filter(m=>['Negocim','Ofertë Dërguar'].includes(m.status)).length,pot=d.reduce((s,m)=>s+(+m.potential||0),0);
  const ag=[...new Set(d.map(m=>m.agentName))].sort(),days=cnt(d,m=>m.date),dk=Object.keys(days).sort().slice(-21),dm=Math.max(1,...dk.map(k=>days[k]));
  const stack=ag.map(a=>{const r=d.filter(m=>m.agentName===a);return`<div class="row"><span>${esc(a)}</span><div class="bar">${ST.map(s=>{const c=r.filter(m=>m.status===s).length;return c?`<div title="${s}: ${c}" style="width:${c/Math.max(1,...ag.map(x=>d.filter(m=>m.agentName===x).length))*100}%;background:${SC[s]}"></div>`:''}).join('')}</div><b>${r.length}</b></div>`}).join('');
  return filters()+`<div class="grid k"><div class="card kpi"><b>${n}</b><span>Takime gjithsej</span></div><div class="card kpi"><b style="color:#16a34a">${won}</b><span>Won</span></div><div class="card kpi"><b>${hot}</b><span>Ofertë / Negocim</span></div><div class="card kpi"><b>${fmt(pot)}</b><span>Potenciali mujor (Lekë)</span></div><div class="card kpi"><b>${n?Math.round(won/n*100):0}%</b><span>Konvertimi në Won</span></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Pipeline sipas statusit</h3>${bars(cnt(d,m=>m.status),ST,SC)}</div>${role==='Agjent'?'':`<div class="card"><h3>Takime sipas agjentit (me status)</h3>${stack||'<span class="mu">Pa të dhëna</span>'}<div class="lg" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">${ST.map(s=>`<div><i style="background:${SC[s]}"></i>${s}</div>`).join('')}</div></div>`}
<div class="card"><h3>Takime ditore (21 ditët e fundit)</h3><div class="col">${dk.map(k=>`<div><span>${days[k]}</span><i style="height:${days[k]/dm*130}px"></i><span>${k.slice(8)}/${k.slice(5,7)}</span></div>`).join('')||'<span class="mu">Pa të dhëna</span>'}</div></div>
<div class="card"><h3>Mënyra e takimit</h3>${donut(cnt(d,m=>m.mode))}</div><div class="card"><h3>Base vs Prospect</h3>${donut(cnt(d,m=>m.type))}</div><div class="card"><h3>Prioriteti</h3>${bars(cnt(d,m=>m.prio),PRI,{High:'#c8102e',Medium:'#f59e0b',Low:'#9ca3af'})}</div></div>`}
const OP=new Set(),tg=id=>{OP.has(id)?OP.delete(id):OP.add(id);draw()};
function more(m){
  const pr=PRODS.filter(p=>(m.prods||{})[p[0]]?.y).map(p=>p[1]+(m.prods[p[0]].q?' ('+m.prods[p[0]].q+')':'')).join(', ');
  const r=(a,b,w)=>`<div${w?' class="w"':''}><span class="mu">${a}</span><br>${esc(b||'–')}</div>`;
  return`<div class="f">${r('Mënyra e takimit',m.mode)}${r('Tipi',m.type)}${r('NIPT',m.nipt)}${r('Industria',m.industry)}${r('Person kontakti',m.contact)}${r('Pozicioni',m.pos)}${r('Telefon',m.phone)}${r('Email',m.email)}${r('Fatura mujore (Lekë)',m.bill?fmt(m.bill):'')}${r('Interes për kalim në Volton',m.volton)}${r('Laptop/Desktop',m.laptop)}${r('Printera',m.printer)}${r('Aksesorë IT',m.acc)}${r('Produktet',pr,1)}${r('Shënime',m.notes,1)}${r('Komentet',m.comment,1)}</div>
  <h3 style="margin:14px 0 6px">Historiku i statusit</h3>${(m.history||[]).slice().reverse().map(h=>`<div style="margin:5px 0;font-size:13px"><span class="mu">${new Date(h.at).toLocaleString('sq-AL')} · ${esc(h.by)}</span> ${pill(h.status)} <span class="mu">${esc(h.comment)}</span></div>`).join('')||'<span class="mu">Pa historik</span>'}`}
function table(d,own){const n=own?9:8;return`<table><tr><th>Data</th><th>Agjenti</th><th>Kompania</th><th>Kontakti</th><th>Prioriteti</th><th>Potenciali</th><th>Statusi</th><th>Komentet</th>${own?'<th></th>':''}</tr>${d.map(m=>`<tr class="rw" onclick="tg('${m.id}')"><td>${OP.has(m.id)?'▾':'▸'} ${esc(m.date)}</td><td>${esc(m.agentName)}</td><td><b>${esc(m.company)}</b><br><span class="mu">${esc(m.mode)} · ${esc(m.type)}</span></td><td>${esc(m.contact)}<br><span class="mu">${esc(m.phone)}</span></td><td>${esc(m.prio)}</td><td>${m.potential?fmt(m.potential):'–'}</td><td>${pill(m.status)}</td><td class="cm">${esc(m.comment)}</td>${own?`<td><button class="b" onclick="event.stopPropagation();ed('${m.id}')">Edito</button></td>`:''}</tr>${OP.has(m.id)?`<tr class="dt"><td colspan="${n}">${more(m)}</td></tr>`:''}`).join('')||`<tr><td colspan="${n}" class="mu">Asnjë takim.</td></tr>`}</table>`}
function list(){return filters()+`<div class="card tw">${table(filt().slice(0,300))}</div>`}
function mine(){const d=M.filter(m=>m.agentId===me.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0));return`<div class="card tw"><h3>Takimet e mia (${d.length})</h3>${table(d,1)}</div>`}
const ed=id=>{edit=M.find(m=>m.id===id);tab='new';draw()};
function form(){
  const m=edit||{date:today(),prods:{}},o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join(''),t=(id,l,v,ty='text')=>`<label>${l}<input id="f_${id}" type="${ty}" value="${esc(v)}"></label>`,s=(id,l,a,v)=>`<label>${l}<select id="f_${id}"><option value=""></option>${o(a,v)}</select></label>`;
  return`<div class="card"><h3>${edit?'Edito takimin':'Takim i ri'}</h3><div class="f">${t('date','Data e takimit',m.date,'date')}${s('mode','Mënyra e takimit',MOD,m.mode)}${s('type','Tipi',TIP,m.type)}${t('company','Kompania *',m.company)}${t('nipt','NIPT',m.nipt)}${t('industry','Industria',m.industry)}${t('contact','Person kontakti',m.contact)}${s('pos','Pozicioni',POZ,m.pos)}${t('phone','Telefon',m.phone,'tel')}${t('email','Email',m.email,'email')}${s('prio','Prioriteti',PRI,m.prio)}${t('potential','Potenciali mujor (Lekë)',m.potential,'number')}${t('bill','Fatura mujore (Lekë)',m.bill,'number')}${s('volton','Interes për kalim në Volton',['Po','Jo'],m.volton)}</div>
<h2>Produktet</h2><div class="f">${PRODS.map(p=>{const x=(m.prods||{})[p[0]]||{};return`<label class="ck"><input type="checkbox" id="y_${p[0]}" ${x.y?'checked':''}>${p[1]}</label>`}).join('')}${t('laptop','Laptop/Desktop (sasia)',m.laptop,'number')}${t('printer','Printera (sasia)',m.printer,'number')}${t('acc','Aksesorë IT (sasia)',m.acc,'number')}</div>
<h2>Shënime</h2><div class="f"><label class="w">Shënime shtesë për takimin<textarea id="f_notes">${esc(m.notes)}</textarea></label></div>
<h2>Statusi dhe komentet</h2><div class="f">${s('status','Statusi *',ST,m.status)}<label class="w">Komentet (sa më të detajuara)<textarea id="f_comment">${esc(m.comment)}</textarea></label></div>
<p><button class="b p" onclick="save()">${edit?'Ruaj ndryshimet':'Regjistro takimin'}</button> ${edit?'<button class="b" onclick="edit=null;draw()">Anulo</button>':''} <span id="msg" class="mu"></span></p></div>`}
async function save(){
  const g=i=>$('#f_'+i).value.trim(),d={};
  ['date','mode','type','company','nipt','industry','contact','pos','phone','email','prio','volton','status','comment','notes'].forEach(k=>d[k]=g(k));
  ['potential','bill','laptop','printer','acc'].forEach(k=>d[k]=g(k)===''?null:+g(k));
  if(!d.company||!d.status||!d.date){$('#msg').textContent='Plotëso Kompania, Data dhe Statusi.';return}
  d.prods={};PRODS.forEach(p=>d.prods[p[0]]={y:$('#y_'+p[0]).checked,q:edit?.prods?.[p[0]]?.q??null});
  try{
    if(edit)await api('PUT','/api/meetings/'+edit.id,d);else await api('POST','/api/meetings',d);
    edit=null;tab=role==='Agjent'?'mine':'list';draw();
  }catch(e){$('#msg').textContent='Gabim në ruajtje: '+e.message}}
function users(){
  if(!U.length)api('GET','/api/users').then(u=>{U=u;draw()});
  const rows=U.map(u=>`<tr><td>${esc(u.name)}<br><span class="mu">@${esc(u.username)}</span></td><td><select onchange="upd('${u.id}',{role:this.value})">${ROLES.map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></td><td><button class="b" onclick="upd('${u.id}',{active:${!u.active}})">${u.active?'Aktiv':'I çaktivizuar'}</button> <button class="b" onclick="eu('${u.id}')">Ndrysho emrin/username</button> <button class="b" onclick="rp('${u.id}')">Fjalëkalim i ri</button></td></tr>`).join('');
  return`<div class="grid g2"><div class="card"><h3>Përdorues i ri</h3><div class="f" style="grid-template-columns:1fr"><label>Emri<input id="n_name"></label><label>Username<input id="n_user" autocapitalize="none"></label><label>Fjalëkalimi (min. 8)<input id="n_pw" type="password"></label><label>Roli<select id="n_role">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select></label></div><p><button class="b p" onclick="addU()">Krijo</button> <span id="msg" class="mu"></span></p></div><div class="card tw"><h3>Përdoruesit (${U.length})</h3><table>${rows}</table></div></div>`}
const upd=async(id,d)=>{try{await api('PUT','/api/users/'+id,d);U=await api('GET','/api/users');draw()}catch(e){alert(e.message);U=await api('GET','/api/users');draw()}};
const eu=id=>{const u=U.find(x=>x.id===id),n=prompt('Emri:',u.name);if(n===null)return;const k=prompt('Username:',u.username);if(k===null)return;upd(id,{name:n,username:k})};
const rp=id=>{const p=prompt('Fjalëkalimi i ri (min. 8 shkronja):');p&&upd(id,{password:p})};
async function addU(){try{await api('POST','/api/users',{name:$('#n_name').value,username:$('#n_user').value,password:$('#n_pw').value,role:$('#n_role').value});U=await api('GET','/api/users');draw()}catch(e){$('#msg').textContent=e.message}}
function csv(){
  const h=['date','mode','agentName','type','company','nipt','industry','contact','pos','phone','email','prio','potential','bill','volton','status','comment'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+h.join(',')+'\n'+filt().map(m=>h.map(k=>q(m[k])).join(',')).join('\n')],{type:'text/csv'}));a.download='takimet_'+today()+'.csv';a.click()}
tok?start():loginView();

</script></body></html>
